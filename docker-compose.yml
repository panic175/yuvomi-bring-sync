# Yuvomi <-> Bring! bridge. No "ports:" - the bridge only talks outward.
# Credentials live in .env (never in git), see .env.example.
# "web" is an external, shared Docker network (docker network create web):
# stacks join it to reach each other's containers by name, here
# http://yuvomi:3000. Docker's own per-project networks cannot do that.
services:
  yuvomi-bring:
    build: .
    image: yuvomi-bring-sync:1.0.0
    container_name: yuvomi-bring
    restart: unless-stopped
    env_file:
      - .env
    environment:
      YUVOMI_URL: http://yuvomi:3000
      POLL_SECONDS: "10"
    volumes:
      - ./data:/data
      # config.json is baked into the image; mount it so skip_lists etc. can
      # be edited without rebuilding (docker restart yuvomi-bring picks it up)
      - ./config.json:/app/config.json:ro
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/data/last_ok') < 60 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  web:
    external: true
