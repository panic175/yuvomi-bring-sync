name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest -v test_bridge
      - name: Coverage gate
        run: |
          pip install coverage
          coverage run --source=bridge -m unittest test_bridge
          coverage report -m --fail-under=90

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t yuvomi-bring-sync .
      - name: Smoke-test the entrypoint
        run: docker run --rm yuvomi-bring-sync python bridge.py --help

  # Full-history scan instead of gitleaks-action: the action derives its
  # commit range from the push event, which breaks on a force-pushed root.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full history
        run: gitleaks detect --source . --redact --exit-code 1 --no-banner
