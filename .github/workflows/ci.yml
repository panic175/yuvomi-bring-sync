name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest -v test_bridge
      - name: Coverage gate
        run: |
          pip install coverage
          coverage run --source=bridge -m unittest test_bridge
          coverage report -m --fail-under=90

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t yuvomi-bring-sync .
      - name: Smoke-test the entrypoint
        run: |
          docker run --rm yuvomi-bring-sync python bridge.py --help
          docker run --rm yuvomi-bring-sync python -c "import aiohttp, bring_api"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' yuvomi-bring-sync

  # Pushes the image to ghcr.io: every push to main bumps the patch version
  # (v1.0.0 -> v1.0.1) and pushes that tag as the ledger, plus :latest and
  # the commit sha; an explicit v* tag publishes its own version.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the version tag back
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are the version ledger
      - name: Next patch version
        id: ver
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$prev" ]; then
            next=v1.0.0
          else
            n=${prev#v}
            next=v${n%.*}.$((${n##*.} + 1))
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.next }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record version tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag "${{ steps.ver.outputs.next }}"
          git push origin "${{ steps.ver.outputs.next }}"

  # Full-history scan instead of gitleaks-action: the action derives its
  # commit range from the push event, which breaks on a force-pushed root.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full history
        run: gitleaks detect --source . --redact --exit-code 1 --no-banner
